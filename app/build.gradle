plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'com.tanzeil.moallemalquran'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tanzeil.moallemalquran'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'QURANLAB_KEY', "\"\${System.getenv('QURANLAB_KEY') ?: ''}\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlinOptions {
    jvmTarget = '17'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'ai.quranlab:tajweedformer:4.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
