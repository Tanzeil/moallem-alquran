plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

// API keys are Base64-encoded into BuildConfig so special characters cannot
// break generated Java source. Decode in QuranLabBridge at runtime.
def quranLabKey = providers.gradleProperty('QURANLAB_KEY')
        .orElse(providers.environmentVariable('QURANLAB_KEY'))
        .getOrElse('')
def encodedQuranLabKey = quranLabKey.getBytes('UTF-8').encodeBase64().toString()

android {
    namespace 'com.tanzeil.moallemalquran'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tanzeil.moallemalquran'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.5.0'
        buildConfigField 'String', 'QURANLAB_KEY_B64', '"' + encodedQuranLabKey + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'ai.quranlab:tajweedformer:4.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
