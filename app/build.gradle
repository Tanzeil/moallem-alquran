plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

// Read the key from a Gradle property first, then the CI environment.
// Escape it before embedding it in the generated Java string literal.
def quranLabKey = providers.gradleProperty('QURANLAB_KEY')
        .orElse(providers.environmentVariable('QURANLAB_KEY'))
        .getOrElse('')
def escapedQuranLabKey = quranLabKey
        .replace('\\\\', '\\\\\\\\')
        .replace('"', '\\\\"')

android {
    namespace 'com.tanzeil.moallemalquran'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tanzeil.moallemalquran'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.5.0'
        buildConfigField 'String', 'QURANLAB_KEY', '"' + escapedQuranLabKey + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'ai.quranlab:tajweedformer:4.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
